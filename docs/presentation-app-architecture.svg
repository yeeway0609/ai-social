<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">不痛 Tone 應用架構圖</title>
  <desc id="desc">以瀏覽器、Nuxt 服務端、AI 改寫引擎、Neon 資料庫與 NVIDIA NIM 呈現完整應用架構。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5bb8ff"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .page { fill: #0b1016; }
      .title { fill: #f7f2e8; font: 700 54px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
      .subtitle { fill: #a8b4c2; font: 400 24px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
      .band { fill: #101923; stroke: #2a3848; stroke-width: 2; }
      .card { fill: #151f2a; stroke: #344557; stroke-width: 2; filter: url(#softShadow); }
      .card-alt { fill: #18242f; stroke: #4d6177; stroke-width: 2; filter: url(#softShadow); }
      .accent { fill: #5bb8ff; }
      .accent-2 { fill: #b8f06a; }
      .accent-3 { fill: #ffb86b; }
      .label { fill: #f7f2e8; font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
      .body { fill: #c8d3de; font: 400 22px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
      .small { fill: #9fb0c0; font: 400 18px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
      .mono { fill: #8ed2ff; font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.5px; }
      .arrow { fill: none; stroke: #5bb8ff; stroke-width: 4; marker-end: url(#arrow); }
      .arrow-muted { fill: none; stroke: #6e8195; stroke-width: 3; marker-end: url(#arrow); }
      .connector-label { fill: #c8d3de; font: 500 17px system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    </style>
  </defs>

  <rect class="page" width="1600" height="900"/>
  <text class="title" x="90" y="95">不痛 Tone：完整應用架構</text>
  <text class="subtitle" x="92" y="135">讀者只設定想看的語氣；平台負責金鑰、資料、模型與改寫流程。</text>

  <rect class="band" x="70" y="185" width="1460" height="610" rx="28"/>
  <text class="mono" x="112" y="230">Vercel Preview／Production</text>

  <rect class="card" x="110" y="285" width="305" height="245" rx="22"/>
  <circle class="accent" cx="160" cy="335" r="18"/>
  <text class="label" x="190" y="345">瀏覽器端</text>
  <text class="body" x="145" y="390">Nuxt／Vue UI</text>
  <text class="small" x="145" y="428">動態牆、留言、聊天</text>
  <text class="small" x="145" y="460">語氣設定</text>
  <text class="small" x="145" y="492">批次改寫佇列</text>

  <rect class="card-alt" x="520" y="255" width="350" height="300" rx="22"/>
  <circle class="accent-2" cx="570" cy="305" r="18"/>
  <text class="label" x="600" y="315">Nuxt Server API</text>
  <text class="body" x="555" y="365">Session／權限驗證</text>
  <text class="small" x="555" y="402">posts、comments、messages</text>
  <text class="small" x="555" y="434">render／render batch</text>
  <text class="small" x="555" y="466">original text endpoint</text>
  <text class="small" x="555" y="498">rate limit 與錯誤碼</text>

  <rect class="card" x="980" y="255" width="420" height="300" rx="22"/>
  <circle class="accent-3" cx="1030" cy="305" r="18"/>
  <text class="label" x="1060" y="315">AI 改寫引擎</text>
  <text class="body" x="1015" y="365">語氣 prompt 與不變量</text>
  <text class="small" x="1015" y="402">使用平台串接的模型</text>
  <text class="small" x="1015" y="434">輸出驗證：網址、數字、標籤</text>
  <text class="small" x="1015" y="466">語意相似度：embedding cosine</text>
  <text class="small" x="1015" y="498">失敗回退：原文＋精準錯誤碼</text>

  <rect class="card-alt" x="520" y="640" width="350" height="120" rx="22"/>
  <text class="label" x="555" y="690">Neon Postgres</text>
  <text class="small" x="555" y="724">users、posts、comments</text>
  <text class="small" x="555" y="752">messages、renditions</text>

  <rect class="card-alt" x="980" y="640" width="420" height="120" rx="22"/>
  <text class="label" x="1015" y="690">模型服務</text>
  <text class="small" x="1015" y="728">NVIDIA NIM</text>
  <text class="small" x="1015" y="756">生成改寫與 embedding 評估</text>

  <path class="arrow" d="M 415 410 C 455 410, 480 410, 520 410"/>
  <text class="connector-label" x="430" y="388">內容請求</text>

  <path class="arrow" d="M 870 410 C 915 410, 935 410, 980 410"/>
  <text class="connector-label" x="895" y="388">改寫協調</text>

  <path class="arrow" d="M 695 555 C 695 590, 695 605, 695 640"/>
  <text class="connector-label" x="715" y="610">讀寫內容與快取</text>

  <path class="arrow" d="M 1190 555 C 1190 590, 1190 605, 1190 640"/>
  <text class="connector-label" x="1210" y="610">呼叫模型服務</text>

  <path class="arrow-muted" d="M 980 780 C 940 810, 910 810, 870 780"/>
  <text class="connector-label" x="895" y="835">回寫固定語氣結果</text>

  <rect x="108" y="815" width="1384" height="2" fill="#263544"/>
  <text class="small" x="112" y="846">
    <tspan x="112" dy="0">重點：原文永遠是資料庫的唯一事實來源；AI 只產生讀者端呈現版本。</tspan>
    <tspan x="112" dy="28">使用平台串接的模型產生改寫；預設語氣可入庫重用，自訂語氣只留在用戶端暫存。</tspan>
  </text>
</svg>
